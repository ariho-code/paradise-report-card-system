services:
  db:
    image: postgres:16-alpine
    container_name: paradise-postgres
    environment:
      POSTGRES_USER: paradise
      POSTGRES_PASSWORD: paradise
      POSTGRES_DB: paradise
    ports:
      - "5433:5432"
    volumes:
      - paradise_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paradise -d paradise"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  paradise_pg:
